<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#070a12;--card:#0c1020;--card-h:#0f1428;--border:#1a2340;
  --accent:#6366f1;--accent-dim:rgba(99,102,241,.12);
  --cyan:#06b6d4;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --text:#e2e8f0;--muted:#94a3b8;--dim:#475569;
  --font-d:'Orbitron',monospace;--font-m:'Space Mono',monospace;--font-b:'Exo 2',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(99,102,241,.12) 1px,transparent 0);background-size:32px 32px;color:var(--text);font-family:var(--font-b);line-height:1.6;min-height:100vh}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);pointer-events:none;z-index:9999}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(7,10,18,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr-l{display:flex;align-items:center;gap:12px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px var(--success)}50%{box-shadow:0 0 18px var(--success)}}
.site-nm{font-family:var(--font-d);font-size:12px;font-weight:700;letter-spacing:.15em}
.site-nm em{color:var(--accent);font-style:normal}
.hdr-c{font-family:var(--font-m);font-size:10px;color:var(--muted);letter-spacing:.04em}
.hdr-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{font-family:var(--font-m);font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:4px;border:1px solid;text-transform:uppercase;white-space:nowrap}
.b-gsc{color:#4285f4;border-color:rgba(66,133,244,.3);background:rgba(66,133,244,.07)}
.b-ga4{color:#ff7043;border-color:rgba(255,112,67,.3);background:rgba(255,112,67,.07)}
.b-dfs{color:var(--cyan);border-color:rgba(6,182,212,.3);background:rgba(6,182,212,.07)}
.b-ts{color:var(--muted);border-color:var(--border);background:rgba(255,255,255,.03)}

/* TAB NAV */
.tab-nav{position:sticky;top:56px;z-index:90;background:rgba(7,10,18,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-nav-inner{display:flex;min-width:max-content;padding:0 24px}
.tab-btn{font-family:var(--font-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:none;border:none;border-bottom:2px solid transparent;padding:13px 14px;cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--muted)}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}
.t-dot{width:5px;height:5px;border-radius:50%;background:rgba(71,85,105,.5);flex-shrink:0;transition:background .3s,box-shadow .3s}
.t-dot.on{background:var(--success);box-shadow:0 0 6px var(--success)}

/* PANELS */
.tab-panel{display:none}.tab-panel.active{display:block}

/* LAYOUT */
.wrap{max-width:1400px;margin:0 auto;padding:28px 32px 64px}
.sec-hdr{display:flex;align-items:center;gap:12px;margin:36px 0 16px}
.sec-hdr:first-child{margin-top:0}
.sec-title{font-family:var(--font-d);font-size:9px;font-weight:700;letter-spacing:.25em;color:var(--accent);text-transform:uppercase;white-space:nowrap}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;transition:border-color .2s,box-shadow .2s,background .2s}
.card:hover{border-color:rgba(99,102,241,.3);box-shadow:0 0 28px rgba(99,102,241,.05);background:var(--card-h)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.g-6040{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.g-4060{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.lbl{font-family:var(--font-m);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}

/* EMPTY STATE */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 20px;text-align:center;gap:14px}
.empty-icon{font-family:var(--font-d);font-size:40px;color:var(--border)}
.empty-title{font-family:var(--font-d);font-size:13px;letter-spacing:.08em;color:var(--muted)}
.empty-cmd{font-family:var(--font-m);font-size:12px;color:var(--accent);background:var(--accent-dim);padding:8px 16px;border-radius:6px;border:1px solid rgba(99,102,241,.3)}
.empty-sub{font-size:11px;color:var(--dim)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0}
.kpi-card:hover{border-color:rgba(99,102,241,.3);box-shadow:0 0 28px rgba(99,102,241,.05)}
.kc-a::before{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.kc-b::before{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.kc-c::before{background:var(--success);box-shadow:0 0 12px var(--success)}
.kc-d::before{background:var(--warning);box-shadow:0 0 12px var(--warning)}
.kpi-lbl{font-family:var(--font-m);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.kpi-val{font-family:var(--font-d);font-size:32px;font-weight:900;line-height:1;color:var(--text);margin-bottom:7px}
.kpi-trnd{font-family:var(--font-m);font-size:10px;display:flex;align-items:center;gap:4px}
.t-up{color:var(--success)}.t-dn{color:var(--danger)}.t-nc{color:var(--dim)}
.kpi-ico{position:absolute;bottom:16px;right:18px;font-size:28px;opacity:.05;line-height:1}

/* CHARTS */
.chart-box{position:relative;height:200px}
.donut-wrap{display:flex;align-items:center;gap:18px;height:200px}
.donut-box{width:160px;flex-shrink:0}
.ch-leg{flex:1;display:flex;flex-direction:column;gap:8px}
.ch-item{display:flex;align-items:center;gap:7px;font-size:11px}
.ch-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.ch-nm{color:var(--muted);flex:1}
.ch-v{font-family:var(--font-m);font-size:11px}

/* TABLES */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{font-family:var(--font-m);font-size:8px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(26,35,64,.4);transition:background .15s;animation:rowIn .3s ease both}
tbody tr:hover{background:rgba(99,102,241,.04)}
tbody tr:last-child{border-bottom:none}
@keyframes rowIn{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
td{padding:8px 10px;color:var(--text);vertical-align:middle}
td.mn{font-family:var(--font-m);font-size:11px}
td.mt{color:var(--muted)}

/* BADGES */
.pb,.kb,.sb{display:inline-flex;align-items:center;font-family:var(--font-m);font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;border:1px solid;letter-spacing:.04em;white-space:nowrap}
.p10{color:var(--success);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}
.p20{color:var(--warning);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.pdn{color:var(--danger);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
.klo{color:var(--success);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}
.kmd{color:var(--warning);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.khi{color:var(--danger);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
.snr{color:var(--warning);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.szr{color:var(--danger);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
.sok{color:var(--success);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08)}
.sdp{color:var(--dim);border-color:var(--border)}
.urg-c{color:var(--danger);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
.urg-h{color:var(--warning);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.urg-m{color:var(--accent);border-color:rgba(99,102,241,.3);background:rgba(99,102,241,.08)}

/* CTR BAR */
.ctr-cell{display:flex;align-items:center;gap:6px}
.ctr-track{flex:1;height:3px;background:var(--border);border-radius:2px;max-width:50px;overflow:hidden}
.ctr-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 1.2s ease}
.ctr-num{font-family:var(--font-m);font-size:10px;width:32px;text-align:right}

/* AUTHORITY RING */
.ring-wrap{width:120px;height:120px;position:relative;flex-shrink:0}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--border);stroke-width:9}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-sc{font-family:var(--font-d);font-size:22px;font-weight:900;line-height:1}
.ring-lb{font-family:var(--font-m);font-size:8px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:2px}

/* ACTION CARDS */
.act-card{display:flex;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-left:3px solid;border-radius:8px;transition:background .2s}
.act-card:hover{background:var(--card-h)}
.act-card.critical{border-left-color:var(--danger)}
.act-card.high{border-left-color:var(--warning)}
.act-card.medium{border-left-color:var(--accent)}
.act-n{font-family:var(--font-d);font-size:20px;font-weight:900;opacity:.2;flex-shrink:0;margin-top:2px;line-height:1}
.act-card.critical .act-n{color:var(--danger)}.act-card.high .act-n{color:var(--warning)}.act-card.medium .act-n{color:var(--accent)}
.act-u{font-family:var(--font-m);font-size:8px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.act-card.critical .act-u{color:var(--danger)}.act-card.high .act-u{color:var(--warning)}.act-card.medium .act-u{color:var(--accent)}
.act-t{font-weight:600;font-size:13px;margin-bottom:4px;line-height:1.3}
.act-d{font-size:11px;color:var(--muted);line-height:1.5}

/* CTR RESCUE CARDS */
.ctr-opp{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s}
.ctr-opp:hover{border-color:rgba(99,102,241,.3)}
.ctr-opp-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ctr-opp-q{font-weight:600;font-size:13px}
.ctr-opp-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctr-opp-body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.copy-block{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:6px;padding:12px}
.copy-lbl{font-family:var(--font-m);font-size:8px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.copy-lbl.new{color:var(--success)}
.copy-val{font-size:12px;color:var(--text);line-height:1.4}
.copy-val.new{color:var(--success)}

/* SCORE CIRCLES */
.score-circles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.score-circle{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.sc-ring{width:80px;height:80px;position:relative}
.sc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.sc-track{fill:none;stroke:var(--border);stroke-width:8}
.sc-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)}
.sc-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:18px;font-weight:900}
.sc-label{font-family:var(--font-m);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;text-align:center}

/* SERP MOVEMENT */
.mv-up{color:var(--success)}.mv-dn{color:var(--danger)}.mv-nc{color:var(--dim)}

/* TECH ISSUES */
.issue-list{display:flex;flex-direction:column;gap:8px}
.issue-item{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:rgba(0,0,0,.15);border-radius:6px;border-left:3px solid}
.issue-item.critical{border-left-color:var(--danger)}.issue-item.high{border-left-color:var(--warning)}.issue-item.medium{border-left-color:var(--accent)}
.issue-pg{font-family:var(--font-m);font-size:10px;color:var(--muted);flex-shrink:0;width:140px}
.issue-txt{font-size:12px}

/* AI RESPONSE */
.ai-resp{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:8px;padding:14px}
.ai-q{font-family:var(--font-m);font-size:10px;color:var(--muted);margin-bottom:8px}
.ai-a{font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.ai-hit{background:rgba(99,102,241,.2);border-radius:3px;padding:0 3px}
.ai-miss-pill{font-family:var(--font-m);font-size:9px;padding:2px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:5px}
.ai-miss{color:var(--danger);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.ai-found{color:var(--success);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3)}

/* BRIEF OUTLINE */
.outline-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(26,35,64,.5)}
.outline-item:last-child{border-bottom:none}
.outline-h{font-family:var(--font-m);font-size:9px;color:var(--dim);width:28px;flex-shrink:0;margin-top:2px}
.outline-txt{font-size:12px;flex:1}
.outline-kw{font-family:var(--font-m);font-size:10px;color:var(--accent);margin-top:3px}

/* STAT PILL */
.stat-pill{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 18px;text-align:center}
.stat-pill-v{font-family:var(--font-d);font-size:22px;font-weight:700}
.stat-pill-l{font-size:10px;color:var(--muted);margin-top:3px}

/* FADE-IN */
.fi{animation:fi .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fi-1{animation-delay:.05s}.fi-2{animation-delay:.1s}.fi-3{animation-delay:.17s}
.fi-4{animation-delay:.24s}.fi-5{animation-delay:.31s}.fi-6{animation-delay:.38s}

/* FOOTER */
.footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.footer-txt{font-family:var(--font-m);font-size:9px;letter-spacing:.04em;color:var(--dim)}
.footer-b{display:flex;gap:8px}

/* RESPONSIVE */
@media(max-width:1024px){
  .kpi-grid,.score-circles{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.g-6040,.g-4060{grid-template-columns:1fr}
  .ctr-opp-body{grid-template-columns:1fr}
}
@media(max-width:600px){
  .hdr{padding:0 14px}.wrap{padding:18px 14px 48px}
  .hdr-c{display:none}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-val{font-size:24px}
  .tab-nav-inner{padding:0 12px}
}
</style>
</head>

</main>

// ── HELPERS ──────────────────────────────────────────────────────────────────
function counter(el, target, dec, sfx) {
  if (!el) return;
  const dur=1200,t0=performance.now();
  const tick=n=>{const p=Math.min((n-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=(e*target).toFixed(dec)+(sfx||'');if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
function trend(cur,prev,posMode){
  if(prev===0&&cur===0)return`<span class="t-nc">— no change</span>`;
  if(prev===0)return`<span class="t-nc">new</span>`;
  const d=cur-prev,pct=Math.abs(Math.round(d/prev*100));
  const good=posMode?d<0:d>0;
  const cls=d===0?'t-nc':good?'t-up':'t-dn';
  const arrow=d===0?'→':good?'↑':'↓';
  return`<span class="${cls}">${arrow} ${posMode?Math.abs(d).toFixed(1)+' pos':pct+'% vs prev'}</span>`;
}
function posBadge(p){return p<=10?`<span class="pb p10">${p.toFixed(1)}</span>`:p<=20?`<span class="pb p20">${p.toFixed(1)}</span>`:`<span class="pb pdn">${p.toFixed(1)}</span>`}
function kdBadge(k){return k<30?`<span class="kb klo">KD ${k}</span>`:k<60?`<span class="kb kmd">KD ${k}</span>`:`<span class="kb khi">KD ${k}</span>`}
function volFmt(v){return v>=1000?(v/1000).toFixed(1)+'K':v}
function scoreColor(s){return s>=90?'var(--success)':s>=50?'var(--warning)':'var(--danger)'}
function empty(cmd,desc){return`<div class="empty"><div class="empty-icon">◈</div><div class="empty-title">No data yet</div><div class="empty-cmd">${cmd}</div>${desc?`<div class="empty-sub">${desc}</div>`:''}</div>`}
